<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie Escape: Last City 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;position:absolute;top:0;left:0}
#screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.93);text-align:center;padding:24px}
#screen h1{font-size:clamp(26px,5vw,54px);color:#ff0033;text-shadow:0 0 20px #ff0033,0 0 40px #ff0033;letter-spacing:5px;margin-bottom:6px}
#screen h2{color:#660000;font-size:14px;letter-spacing:3px;margin-bottom:16px}
.story{color:#993333;font-size:13px;max-width:480px;line-height:1.8;border:1px solid #330000;padding:14px;background:rgba(80,0,0,.1);margin:12px auto}
.btn{margin-top:18px;padding:13px 38px;background:transparent;border:2px solid #ff0033;color:#ff0033;font-size:17px;font-family:'Courier New',monospace;cursor:pointer;letter-spacing:3px;text-shadow:0 0 8px #ff0033;box-shadow:0 0 15px rgba(255,0,51,.3);transition:all .2s}
.btn:hover{background:rgba(255,0,51,.15);box-shadow:0 0 35px rgba(255,0,51,.7)}
#hs{color:#440000;font-size:12px;margin-top:8px}
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:20;padding:12px 16px;display:flex;justify-content:space-between;display:none}
.hleft,.hright{display:flex;flex-direction:column;gap:5px}
.lbl{color:#550000;font-size:10px;letter-spacing:2px}
#hpbg{width:180px;height:13px;background:#1a0000;border:1px solid #440000}
#hpfill{height:100%;background:linear-gradient(90deg,#cc0000,#ff4400);transition:width .1s}
.hval{color:#ff3333;font-size:14px;font-weight:bold;text-shadow:0 0 6px #ff0033}
#waveinfo{text-align:right}
#wavetxt{color:#ff3333;font-size:15px;font-weight:bold}
#scoretxt{color:#cc2222;font-size:12px}
#encount{color:#552222;font-size:11px}
#mmwrap{position:fixed;bottom:14px;right:14px;z-index:20;border:1px solid #440000;display:none}
#mmwrap canvas{display:block}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,60,60,.5);font-size:18px;pointer-events:none;z-index:15;display:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:10;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
#dmgflash{position:fixed;inset:0;pointer-events:none;z-index:11;background:rgba(200,0,0,0);transition:background .05s}
</style>
</head>
<body>
<div id="screen">
  <h1>ZOMBIE ESCAPE</h1>
  <h2>LAST CITY</h2>
  <div class="story">
    Вирус Z-13 уничтожил цивилизацию.<br>
    Ты единственный выживший в Новограде.<br>
    Улицы кишат мертвецами. Патроны кончаются.<br>
    <em style="color:#ff2200">Выживи любой ценой.</em>
  </div>
  <div id="hs">Рекорд: <span id="hsval">0</span></div>
  <button class="btn" id="mainbtn" onclick="startGame()">&#9654; ИГРАТЬ</button>
</div>
<div id="hud">
  <div class="hleft">
    <div><div class="lbl">ЗДОРОВЬЕ</div><div id="hpbg"><div id="hpfill" style="width:100%"></div></div><div class="hval"><span id="hpval">100</span>/100</div></div>
    <div><div class="lbl">ПАТРОНЫ</div><div class="hval"><span id="ammoval">30</span>/60</div></div>
  </div>
  <div class="hright" id="waveinfo">
    <div id="wavetxt">ВОЛНА 1</div>
    <div id="scoretxt">ОЧКИ: 0</div>
    <div id="encount">Врагов: 0</div>
  </div>
</div>
<div id="mmwrap"><canvas id="mm" width="120" height="120"></canvas></div>
<div id="cross">+</div>
<div id="vignette"></div>
<div id="dmgflash"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== ZOMBIE ESCAPE: LAST CITY 3D =====
var W=window.innerWidth, H=window.innerHeight;
var STATE='menu', score=0, wave=1, gameTime=0;
var highScore=parseInt(localStorage.getItem('ze3d_hs')||'0');

// UI refs
var screenEl=document.getElementById('screen');
var hudEl=document.getElementById('hud');
var mmWrap=document.getElementById('mmwrap');
var hpFill=document.getElementById('hpfill');
var hpVal=document.getElementById('hpval');
var ammoVal=document.getElementById('ammoval');
var waveTxt=document.getElementById('wavetxt');
var scoreTxt=document.getElementById('scoretxt');
var enCount=document.getElementById('encount');
var hsVal=document.getElementById('hsval');
var crossEl=document.getElementById('cross');
var dmgFlash=document.getElementById('dmgflash');
var mmCanvas=document.getElementById('mm');
var mmCtx=mmCanvas.getContext('2d');
hsVal.textContent=highScore;

// THREE.JS
var scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x050508,0.038);
scene.background=new THREE.Color(0x050508);
var camera=new THREE.PerspectiveCamera(55,W/H,0.1,80);
camera.position.set(0,22,13);
camera.lookAt(0,0,0);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(W,H);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize',function(){
  W=window.innerWidth;H=window.innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
});

// Raycaster
var RC=new THREE.Raycaster();
var mNDC=new THREE.Vector2();
var mWorld=new THREE.Vector3();
var gPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
var clock=new THREE.Clock();

// LIGHTING
scene.add(new THREE.AmbientLight(0x111133,0.6));
var moon=new THREE.DirectionalLight(0x2233aa,0.4);
moon.position.set(-15,25,-10);
moon.castShadow=true;
moon.shadow.mapSize.width=moon.shadow.mapSize.height=1024;
moon.shadow.camera.near=1;moon.shadow.camera.far=70;
moon.shadow.camera.left=moon.shadow.camera.bottom=-35;
moon.shadow.camera.right=moon.shadow.camera.top=35;
scene.add(moon);
var flash=new THREE.SpotLight(0xffffcc,4,22,Math.PI/7,0.25,1.8);
var flashTgt=new THREE.Object3D();scene.add(flashTgt);flash.target=flashTgt;scene.add(flash);
// Уличные фонари
[[-12,12],[12,12],[-12,-12],[12,-12],[0,20],[0,-20]].forEach(function(lp){
  var pt=new THREE.PointLight(0xff4400,0.8,10);pt.position.set(lp[0],4,lp[1]);scene.add(pt);
  var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,4,6),new THREE.MeshLambertMaterial({color:0x222222}));
  pole.position.set(lp[0],2,lp[1]);scene.add(pole);
});

// GROUND
var gnd=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0x0e0e0e}));
gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
// Разметка
function addLine(x,z,w,d){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({color:0x2a2a2a}));
  m.rotation.x=-Math.PI/2;m.position.set(x,0.01,z);scene.add(m);
}
for(var li=-4;li<=4;li++){addLine(0,li*4,0.2,2.5);addLine(li*4,0,2.5,0.2);}

// BUILDINGS
var bldData=[];
function mkBld(x,z,w,d,h,col){
  var mat=new THREE.MeshLambertMaterial({color:col||0x151520});
  var mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.position.set(x,h/2,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  // Окна
  var wm=new THREE.MeshBasicMaterial({color:0x221100});
  for(var wi=0;wi<Math.floor(w)*2;wi++){
    var wn=new THREE.Mesh(new THREE.PlaneGeometry(0.45,0.45),wm.clone());
    wn.material.color.setHex(Math.random()>.5?0x331500:0x000000);
    wn.position.set(x+(Math.random()-.5)*(w-.7),Math.random()*(h-1)+0.5,z+d/2+0.01);
    scene.add(wn);
  }
  bldData.push({x:x,z:z,hw:w/2+0.4,hd:d/2+0.4});
}
[[-15,28,10,6,8],[-3,28,8,6,10],[9,28,8,6,7],
 [-15,-28,10,6,9],[-3,-28,8,6,11],[9,-28,8,6,8],
 [-28,14,6,10,7],[-28,2,6,8,9],[-28,-13,6,10,8],
 [28,14,6,10,8],[28,2,6,8,7],[28,-13,6,10,10],
 [-13,10,5,4,4,0x111118],[-13,-10,5,4,3,0x111118],
 [13,10,5,4,5,0x111118],[13,-10,5,4,4,0x111118],
 [0,14,4,5,3,0x110f0f],[0,-14,4,5,4,0x110f0f]
].forEach(function(b){mkBld(b[0],b[1],b[2],b[3],b[4],b[5]);});
// Мусор
for(var di=0;di<25;di++){
  var db=new THREE.Mesh(new THREE.BoxGeometry(.3+Math.random()*.6,.05+Math.random()*.35,.3+Math.random()*.6),new THREE.MeshLambertMaterial({color:0x1a1a1a}));
  var da=Math.random()*Math.PI*2,dd=6+Math.random()*18;
  db.position.set(Math.cos(da)*dd,0.08,Math.sin(da)*dd);db.rotation.y=Math.random()*Math.PI;scene.add(db);
}

// RAIN
var RCNT=900,rPos=new Float32Array(RCNT*3),rSpd=new Float32Array(RCNT);
for(var ri=0;ri<RCNT;ri++){rPos[ri*3]=(Math.random()-.5)*60;rPos[ri*3+1]=Math.random()*20;rPos[ri*3+2]=(Math.random()-.5)*60;rSpd[ri]=8+Math.random()*5;}
var rGeo=new THREE.BufferGeometry();rGeo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
var rain=new THREE.Points(rGeo,new THREE.PointsMaterial({color:0x4488bb,size:0.07,transparent:true,opacity:0.45}));
scene.add(rain);

// PLAYER
var PL_SPD=6,PL_HP=100,PL_AMMO=30,PL_MAX_AMMO=60,SHOOT_CD=0.22;
var plPos=new THREE.Vector3(0,0,0),plAngle=0,plHP=100,plAmmo=30,plSCD=0,plICD=0;
var plGroup=new THREE.Group();
(function(){
  var bm=new THREE.MeshLambertMaterial({color:0x334455}),hm=new THREE.MeshLambertMaterial({color:0x885533}),gm=new THREE.MeshLambertMaterial({color:0x222222});
  var body=new THREE.Mesh(new THREE.BoxGeometry(.6,.8,.35),bm);body.position.y=.8;body.castShadow=true;plGroup.add(body);
  var head=new THREE.Mesh(new THREE.BoxGeometry(.38,.38,.38),hm);head.position.y=1.5;head.castShadow=true;plGroup.add(head);
  [-.15,.15].forEach(function(lx){var leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.55,.22),bm);leg.position.set(lx,.28,0);plGroup.add(leg);});
  var gun=new THREE.Mesh(new THREE.BoxGeometry(.07,.1,.42),gm);gun.position.set(.33,.88,-.22);plGroup.add(gun);
}());
scene.add(plGroup);

// ENEMY TYPES
var ETYPES={
  walker:{color:0x2d5a2d,hp:40,spd:1.8,dmg:8,sc:10,sz:1.0},
  runner:{color:0x8a8a10,hp:20,spd:4.5,dmg:5,sc:15,sz:.85},
  brute: {color:0x7a2200,hp:150,spd:1.2,dmg:15,sc:30,sz:1.5},
  boss:  {color:0xcc0000,hp:800,spd:2.2,dmg:25,sc:200,sz:2.5}
};
var enemies=[],bullets=[],pickups=[],parts=[],bloodDecals=[];

function mkEnemyMesh(type){
  var g=new THREE.Group(),td=ETYPES[type],s=td.sz;
  var mat=new THREE.MeshLambertMaterial({color:td.color});
  var body=new THREE.Mesh(new THREE.BoxGeometry(.6*s,.8*s,.35*s),mat);body.position.y=.8*s;body.castShadow=true;g.add(body);
  var head=new THREE.Mesh(new THREE.BoxGeometry(.4*s,.4*s,.4*s),mat);head.position.y=1.45*s;head.castShadow=true;g.add(head);
  var eyeM=new THREE.MeshBasicMaterial({color:type==='boss'?0xffaa00:0xff2200});
  [-.1*s,.1*s].forEach(function(ex){var e=new THREE.Mesh(new THREE.BoxGeometry(.08*s,.06*s,.04*s),eyeM);e.position.set(ex,1.5*s,.21*s);g.add(e);});
  [-.15*s,.15*s].forEach(function(lx){var l=new THREE.Mesh(new THREE.BoxGeometry(.22*s,.55*s,.22*s),mat);l.position.set(lx,.28*s,0);g.add(l);});
  [-.45*s,.45*s].forEach(function(ax,i){var a=new THREE.Mesh(new THREE.BoxGeometry(.2*s,.5*s,.2*s),mat);a.position.set(ax,.9*s,0);a.rotation.z=i===0?.5:-.5;g.add(a);});
  if(type==='boss'){
    var hmat=new THREE.MeshLambertMaterial({color:0x440000});
    [-.2,.2].forEach(function(hx){var h=new THREE.Mesh(new THREE.ConeGeometry(.09,.45,6),hmat);h.position.set(hx,1.95,0);g.add(h);});
    var bpGeo=new THREE.PlaneGeometry(2.5,.2);
    var bpMat=new THREE.MeshBasicMaterial({color:0xff0000,side:THREE.DoubleSide});
    var bp=new THREE.Mesh(bpGeo,bpMat);bp.position.y=3.6;bp.rotation.x=-Math.PI/2;g.add(bp);
    g.userData.hpBar=bp;g.userData.hpMat=bpMat;
  }
  return g;
}

function spawnEnemy(type,x,z){
  var td=ETYPES[type],mesh=mkEnemyMesh(type);
  mesh.position.set(x,0,z);scene.add(mesh);
  enemies.push({mesh:mesh,type:type,hp:td.hp,maxHp:td.hp,spd:td.spd,dmg:td.dmg,sc:td.sc,alive:true,dmgCD:0,walkT:Math.random()*6.28});
}
function getSpawnXZ(){var a=Math.random()*Math.PI*2,d=26+Math.random()*4;return{x:Math.cos(a)*d,z:Math.sin(a)*d};}

// WAVES
var wActive=false,wQueue=[],wSpawnT=0,wNextT=0,W_SPAWN_INT=1.4,W_BREAK=5;
function buildQueue(n){
  var q=[];
  var w=3+n*2,r=Math.max(0,n-1)*2,b=Math.floor(n/2);
  for(var i=0;i<w;i++)q.push('walker');
  for(var i=0;i<r;i++)q.push('runner');
  for(var i=0;i<b;i++)q.push('brute');
  for(var i=q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=q[i];q[i]=q[j];q[j]=t;}
  if(n%5===0)q.push('boss');
  return q;
}
function startWave(n){
  wave=n;wQueue=buildQueue(n);wSpawnT=0;wActive=true;
  waveTxt.textContent='ВОЛНА '+n;waveTxt.style.color=n%5===0?'#ff0000':'#ff3333';
}

// BULLETS
var BSPD=18,BDMG=20;
var bPool=[],bMat=new THREE.MeshBasicMaterial({color:0xffaa00}),bGeo=new THREE.SphereGeometry(.08,4,4);
function getBullet(){
  for(var i=0;i<bPool.length;i++)if(!bPool[i].active)return bPool[i];
  var m=new THREE.Mesh(bGeo,bMat);scene.add(m);
  var b={mesh:m,vx:0,vz:0,dist:0,active:false};bPool.push(b);return b;
}
function fireBullet(x,z,angle){
  var b=getBullet();b.mesh.position.set(x,.5,z);b.vx=Math.sin(angle)*BSPD;b.vz=Math.cos(angle)*BSPD;b.dist=0;b.active=true;b.mesh.visible=true;
  playShot();
}

// PICKUPS
var pkMats={medkit:new THREE.MeshLambertMaterial({color:0x00cc44}),ammo:new THREE.MeshLambertMaterial({color:0xffaa00})};
function spawnPickup(type,x,z){
  var geo=type==='medkit'?new THREE.BoxGeometry(.5,.5,.5):new THREE.BoxGeometry(.35,.25,.45);
  var m=new THREE.Mesh(geo,pkMats[type]);m.position.set(x,.3,z);scene.add(m);
  pickups.push({mesh:m,type:type,alive:true,bobT:Math.random()*6.28});
}

// BLOOD
var bloodM=new THREE.MeshBasicMaterial({color:0x770000,side:THREE.DoubleSide});
function spawnBlood(x,z,n){
  for(var i=0;i<n;i++){
    var m=new THREE.Mesh(new THREE.PlaneGeometry(.1+Math.random()*.15,.1+Math.random()*.15),bloodM.clone());
    m.rotation.x=-Math.PI/2;m.position.set(x+(Math.random()-.5)*.8,.01,z+(Math.random()-.5)*.8);scene.add(m);
    bloodDecals.push({mesh:m,life:12});
  }
  for(var i=0;i<5;i++){
    var pm=new THREE.Mesh(new THREE.SphereGeometry(.04,4,4),new THREE.MeshBasicMaterial({color:0xaa0000}));
    pm.position.set(x,.3,z);
    parts.push({mesh:pm,vx:(Math.random()-.5)*5,vy:Math.random()*3+1,vz:(Math.random()-.5)*5,life:.5});
    scene.add(pm);
  }
}

// AUDIO
var audioCtx=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();startMusic();}catch(e){}}
function playShot(){
  if(!audioCtx)return;var t=audioCtx.currentTime;
  var o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  f.type='highpass';f.frequency.value=200;o.type='sawtooth';
  o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(40,t+.1);
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(f);f.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.12);
}
function playHit(){
  if(!audioCtx)return;var t=audioCtx.currentTime;
  var b=audioCtx.createBuffer(1,audioCtx.sampleRate*.05,audioCtx.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  var s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=b;
  g.gain.setValueAtTime(.2,t);s.connect(g);g.connect(audioCtx.destination);s.start(t);
}
function playPickup(){
  if(!audioCtx)return;var t=audioCtx.currentTime;
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.setValueAtTime(400,t);o.frequency.setValueAtTime(600,t+.05);o.frequency.setValueAtTime(800,t+.1);
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.2);
}
function playHurt(){
  if(!audioCtx)return;var t=audioCtx.currentTime;
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';
  o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.2);
}
function startMusic(){
  if(!audioCtx)return;var t=audioCtx.currentTime+.1;
  function bar(){
    var notes=[{f:60,s:0,d:.35},{f:0,s:.5},{f:80,s:1,d:.3},{f:0,s:1.5},{f:60,s:2,d:.35},{f:0,s:2.5},{f:70,s:3,d:.3},{f:55,s:3.5,d:.2}];
    notes.forEach(function(n){if(!n.f)return;var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=n.f;var nt=t+n.s*.5;g.gain.setValueAtTime(.05,nt);g.gain.exponentialRampToValueAtTime(.001,nt+n.d);o.connect(g);g.connect(audioCtx.destination);o.start(nt);o.stop(nt+n.d);});
    t+=4*.5;setTimeout(bar,Math.max(0,(t-audioCtx.currentTime-.1)*1000));
  }
  bar();
}

// INPUT
var keys={};
window.addEventListener('keydown',function(e){keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)!==-1)e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
var mouseDown=false;
window.addEventListener('mousemove',function(e){mNDC.x=(e.clientX/W)*2-1;mNDC.y=-(e.clientY/H)*2+1;});
window.addEventListener('mousedown',function(e){if(e.button===0){mouseDown=true;initAudio();}});
window.addEventListener('mouseup',function(e){if(e.button===0)mouseDown=false;});

// HELPERS
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function collideBld(x,z){for(var i=0;i<bldData.length;i++){var b=bldData[i];if(Math.abs(x-b.x)<b.hw&&Math.abs(z-b.z)<b.hd)return true;}return false;}

// MINIMAP
function drawMM(){
  var s=120/60;
  mmCtx.fillStyle='#080808';mmCtx.fillRect(0,0,120,120);
  mmCtx.fillStyle='#1a1a28';
  bldData.forEach(function(b){mmCtx.fillRect((b.x-b.hw+30)*s,(b.z-b.hd+30)*s,b.hw*2*s,b.hd*2*s);});
  mmCtx.fillStyle='#00cc44';
  pickups.forEach(function(p){if(!p.alive)return;mmCtx.fillRect((p.mesh.position.x+30)*s-2,(p.mesh.position.z+30)*s-2,4,4);});
  mmCtx.fillStyle='#ff2200';
  enemies.forEach(function(e){if(!e.alive)return;var ex=(e.mesh.position.x+30)*s,ez=(e.mesh.position.z+30)*s;mmCtx.fillRect(ex-2,ez-2,4,4);});
  var px=(plPos.x+30)*s,pz=(plPos.z+30)*s;
  mmCtx.fillStyle='#ffffff';mmCtx.fillRect(px-3,pz-3,6,6);
  mmCtx.strokeStyle='#440000';mmCtx.strokeRect(0,0,120,120);
}

// KILL ENEMY
function killEnemy(i){
  var e=enemies[i];if(!e.alive)return;e.alive=false;scene.remove(e.mesh);
  spawnBlood(e.mesh.position.x,e.mesh.position.z,6);
  score+=e.sc;
  if(Math.random()<.28){spawnPickup(Math.random()<.5?'medkit':'ammo',e.mesh.position.x+(Math.random()-.5)*1.5,e.mesh.position.z+(Math.random()-.5)*1.5);}
}

// GAME START/OVER
function startGame(){
  initAudio();
  plHP=PL_HP;plAmmo=PL_AMMO;plPos.set(0,0,0);plAngle=0;plSCD=0;plICD=0;score=0;wave=1;gameTime=0;
  enemies.forEach(function(e){scene.remove(e.mesh);});enemies.length=0;
  bPool.forEach(function(b){b.active=false;b.mesh.visible=false;});
  pickups.forEach(function(p){scene.remove(p.mesh);});pickups.length=0;
  parts.forEach(function(p){scene.remove(p.mesh);});parts.length=0;
  bloodDecals.forEach(function(d){scene.remove(d.mesh);});bloodDecals.length=0;
  screenEl.style.display='none';hudEl.style.display='flex';mmWrap.style.display='block';crossEl.style.display='block';
  STATE='playing';clock.start();wNextT=0;startWave(1);
}
function gameOver(){
  STATE='gameover';
  if(score>highScore){highScore=score;localStorage.setItem('ze3d_hs',highScore);}
  hsVal.textContent=highScore;
  document.getElementById('screen-title')||0;
  document.querySelector('#screen h1').textContent='КОНЕЦ';
  document.querySelector('#screen h2').textContent='ИГРА ОКОНЧЕНА';
  document.querySelector('.story').innerHTML='Волна: '+wave+'<br>Счёт: '+score+'<br>Рекорд: '+highScore;
  document.getElementById('mainbtn').textContent='↺ СНОВА';
  document.getElementById('mainbtn').onclick=startGame;
  screenEl.style.display='flex';hudEl.style.display='none';mmWrap.style.display='none';crossEl.style.display='none';
}

// MAIN LOOP
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),.05);
  if(STATE!=='playing'){renderer.render(scene,camera);return;}
  gameTime+=dt;

  // Мышь -> мир
  RC.setFromCamera(mNDC,camera);
  var mhit=RC.ray.intersectPlane(gPlane,mWorld);

  // Движение игрока
  var mx=0,mz=0;
  if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(mx||mz){var ml=Math.sqrt(mx*mx+mz*mz);mx/=ml;mz/=ml;
    var nx=clamp(plPos.x+mx*PL_SPD*dt,-27,27),nz=clamp(plPos.z+mz*PL_SPD*dt,-27,27);
    if(!collideBld(nx,plPos.z))plPos.x=nx;if(!collideBld(plPos.x,nz))plPos.z=nz;
  }
  if(mhit){var dx=mWorld.x-plPos.x,dz=mWorld.z-plPos.z;if(dx*dx+dz*dz>.01)plAngle=Math.atan2(dx,dz);}
  plGroup.position.set(plPos.x,0,plPos.z);plGroup.rotation.y=plAngle;

  // Фонарик
  flash.position.set(plPos.x,3,plPos.z);
  flashTgt.position.set(plPos.x+Math.sin(plAngle)*14,0,plPos.z+Math.cos(plAngle)*14);

  // Стрельба
  plSCD=Math.max(0,plSCD-dt);
  if(mouseDown&&plSCD<=0&&plAmmo>0){fireBullet(plPos.x,plPos.z,plAngle);plAmmo--;plSCD=SHOOT_CD;}

  // Пули
  bPool.forEach(function(b){
    if(!b.active)return;
    b.mesh.position.x+=b.vx*dt;b.mesh.position.z+=b.vz*dt;
    b.dist+=Math.sqrt(b.vx*b.vx+b.vz*b.vz)*dt;
    var bx=b.mesh.position.x,bz=b.mesh.position.z,hit=false;
    for(var i=0;i<enemies.length&&!hit;i++){
      var e=enemies[i];if(!e.alive)continue;
      var ex=e.mesh.position.x,ez=e.mesh.position.z,r=.6*ETYPES[e.type].sz;
      if(Math.abs(bx-ex)<r&&Math.abs(bz-ez)<r){e.hp-=BDMG;playHit();spawnBlood(ex,ez,3);if(e.hp<=0)killEnemy(i);hit=true;}
    }
    if(!hit&&collideBld(bx,bz))hit=true;
    if(hit||b.dist>22){b.active=false;b.mesh.visible=false;}
  });

  // Неуязвимость
  plICD=Math.max(0,plICD-dt);

  // Враги
  enemies.forEach(function(e){
    if(!e.alive)return;
    var ex=e.mesh.position.x,ez=e.mesh.position.z;
    var dx=plPos.x-ex,dz=plPos.z-ez,dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>.5){
      var nx=ex+(dx/dist)*e.spd*dt,nz=ez+(dz/dist)*e.spd*dt;
      if(!collideBld(nx,ez))e.mesh.position.x=nx;if(!collideBld(ex,nz))e.mesh.position.z=nz;
      e.mesh.rotation.y=Math.atan2(dx,dz);
    }
    e.walkT+=dt*e.spd*2;e.mesh.position.y=Math.abs(Math.sin(e.walkT))*.1*ETYPES[e.type].sz;
    if(dist<.8*ETYPES[e.type].sz+.5){
      e.dmgCD=Math.max(0,e.dmgCD-dt);
      if(e.dmgCD<=0&&plICD<=0){plHP-=e.dmg;plICD=.3;playHurt();e.dmgCD=1.0;
        dmgFlash.style.background='rgba(200,0,0,0.35)';setTimeout(function(){dmgFlash.style.background='rgba(200,0,0,0)';},80);
        if(plHP<=0){gameOver();return;}
      }
    }
    if(e.type==='boss'&&e.mesh.userData.hpBar){
      var pct=e.hp/ETYPES.boss.hp;e.mesh.userData.hpBar.scale.x=Math.max(0,pct);
      e.mesh.userData.hpMat.color.setHex(pct>.5?0xff4400:0xff0000);
    }
  });

  // Волны
  if(wActive){
    if(wQueue.length>0){wSpawnT-=dt;if(wSpawnT<=0){var sp=getSpawnXZ();spawnEnemy(wQueue.pop(),sp.x,sp.z);wSpawnT=W_SPAWN_INT;}}
    else{var ac=0;enemies.forEach(function(e){if(e.alive)ac++;});if(ac===0){wActive=false;wNextT=W_BREAK;}}
  } else if(wNextT>0){
    wNextT-=dt;waveTxt.textContent='СЛЕД. ВОЛНА: '+Math.ceil(wNextT)+'с';
    if(wNextT<=0)startWave(wave+1);
  }

  // Подбираемые предметы
  pickups.forEach(function(p){
    if(!p.alive)return;
    p.bobT+=dt*2;p.mesh.position.y=.3+Math.sin(p.bobT)*.1;p.mesh.rotation.y+=dt*1.5;
    var dx=plPos.x-p.mesh.position.x,dz=plPos.z-p.mesh.position.z;
    if(dx*dx+dz*dz<1.4){
      if(p.type==='medkit')plHP=Math.min(PL_HP,plHP+30);else plAmmo=Math.min(PL_MAX_AMMO,plAmmo+30);
      playPickup();scene.remove(p.mesh);p.alive=false;
    }
  });

  // Частицы
  parts.forEach(function(p){
    if(p.life<=0)return;
    p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;
    p.vy-=15*dt;p.life-=dt;p.mesh.visible=p.life>0;
  });

  // Дождь
  var ra=rGeo.attributes.position.array;
  for(var ri=0;ri<RCNT;ri++){
    ra[ri*3+1]-=rSpd[ri]*dt;
    if(ra[ri*3+1]<0){ra[ri*3]=(Math.random()-.5)*60;ra[ri*3+1]=18+Math.random()*4;ra[ri*3+2]=(Math.random()-.5)*60;}
  }
  rGeo.attributes.position.needsUpdate=true;

  // Камера
  camera.position.x+=(plPos.x-camera.position.x)*4*dt;
  camera.position.z+=(plPos.z+12-camera.position.z)*4*dt;
  camera.position.y+=(22-camera.position.y)*4*dt;
  camera.lookAt(plPos.x,0,plPos.z);

  // HUD
  hpFill.style.width=Math.max(0,plHP/PL_HP*100)+'%';
  hpFill.style.background=plHP>50?'linear-gradient(90deg,#cc0000,#ff4400)':plHP>25?'linear-gradient(90deg,#cc6600,#ffaa00)':'linear-gradient(90deg,#880000,#cc0000)';
  hpVal.textContent=Math.max(0,Math.ceil(plHP));ammoVal.textContent=plAmmo;
  scoreTxt.textContent='ОЧКИ: '+score;
  var alv=0;enemies.forEach(function(e){if(e.alive)alv++;});
  enCount.textContent='Врагов: '+(alv+wQueue.length);
  drawMM();
  renderer.render(scene,camera);
}

animate();
</script>
