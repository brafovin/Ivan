<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лесная Атака 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:fixed;top:20px;left:20px;pointer-events:none;z-index:10}
.lbl{color:#aaa;font-size:11px;letter-spacing:1px;margin-bottom:4px}
#hp-wrap{width:230px;height:20px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);border-radius:10px;overflow:hidden}
#hp-bar{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);border-radius:10px;transition:width .15s}
#hp-txt{color:#fff;font-size:13px;margin-top:4px;text-shadow:1px 1px 2px #000}
#sc-txt{color:#ffd700;font-size:16px;font-weight:bold;margin-top:10px;text-shadow:1px 1px 3px #000}
#kl-txt{color:#a8dadc;font-size:13px;margin-top:3px;text-shadow:1px 1px 2px #000}
#en-txt{color:#ff9966;font-size:12px;margin-top:2px}
#ctrl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:12px;text-align:center;pointer-events:none}
#over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);flex-direction:column;align-items:center;justify-content:center;z-index:100}
#over h1{color:#e63946;font-size:64px;text-shadow:0 0 30px #e63946;margin-bottom:12px}
#over p{color:#fff;font-size:20px;margin-bottom:24px}
#over button{padding:13px 40px;font-size:18px;background:#e63946;color:#fff;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
  <div class="lbl">ЗДОРОВЬЕ</div>
  <div id="hp-wrap"><div id="hp-bar"></div></div>
  <div id="hp-txt">100 / 100</div>
  <div id="sc-txt">&#9733; Очки: 0</div>
  <div id="kl-txt">Убито: 0</div>
  <div id="en-txt">Враги: 0</div>
</div>
<div id="ctrl">W/&uarr; Газ &nbsp;&middot;&nbsp; S/&darr; Тормоз &nbsp;&middot;&nbsp; A/D Руль &nbsp;&middot;&nbsp; ПРОБЕЛ Ручной тормоз</div>
<div id="over">
  <h1>ИГРА ОКОНЧЕНА</h1>
  <p id="res"></p>
  <button onclick="location.reload()">Играть снова</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var MAP=45,HALF=22.5;
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize',function(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0520);
scene.fog=new THREE.Fog(0x1a0830,30,75);
var cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,200);
cam.position.set(0,8,-14);

scene.add(new THREE.AmbientLight(0x2a1040,0.7));
var dL=new THREE.DirectionalLight(0xff7030,1.4);
dL.position.set(-20,10,-15);dL.castShadow=true;
dL.shadow.mapSize.width=dL.shadow.mapSize.height=2048;
dL.shadow.camera.near=1;dL.shadow.camera.far=80;
dL.shadow.camera.left=dL.shadow.camera.bottom=-30;
dL.shadow.camera.right=dL.shadow.camera.top=30;
scene.add(dL);
var mL=new THREE.DirectionalLight(0x3050c0,0.4);mL.position.set(15,25,10);scene.add(mL);
scene.add(new THREE.HemisphereLight(0xff4820,0x180c28,0.45));

// SKY
(function(){
  var sm=new THREE.ShaderMaterial({side:THREE.BackSide,
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec3 vP;void main(){float t=clamp(vP.y/130.0,0.0,1.0);vec3 c=mix(vec3(0.70,0.20,0.04),vec3(0.03,0.01,0.10),pow(t,0.5));gl_FragColor=vec4(c,1.0);}'
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(130,32,16),sm));
  var sp=[];
  for(var i=0;i<500;i++){var phi=Math.acos(2*Math.random()-1),th=Math.random()*6.28,r=120;sp.push(r*Math.sin(phi)*Math.cos(th),Math.abs(r*Math.cos(phi))+5,r*Math.sin(phi)*Math.sin(th));}
  var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.4,transparent:true,opacity:0.8})));
}());

// GROUND
var gg=new THREE.PlaneGeometry(MAP,MAP,50,50);
var gp=gg.attributes.position;
for(var i=0;i<gp.count;i++){var x=gp.getX(i),z=gp.getY(i);if(Math.sqrt(x*x+z*z)>5)gp.setZ(i,Math.sin(x*0.4)*Math.cos(z*0.4)*0.3+(Math.random()-0.5)*0.1);}
gg.computeVertexNormals();
var gnd=new THREE.Mesh(gg,new THREE.MeshLambertMaterial({color:0x1a2d0d}));
gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);

// ROCKS
for(var ri=0;ri<12;ri++){
  var rs=0.3+Math.random()*0.8;
  var rk=new THREE.Mesh(new THREE.DodecahedronGeometry(rs,0),new THREE.MeshPhongMaterial({color:0x444455}));
  var rx,rz;do{rx=(Math.random()-0.5)*40;rz=(Math.random()-0.5)*40;}while(Math.sqrt(rx*rx+rz*rz)<6);
  rk.position.set(rx,rs*0.35,rz);rk.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);rk.castShadow=true;scene.add(rk);
}

// TREES
var tM=new THREE.MeshLambertMaterial({color:0x3a1e0a});
var pM=[new THREE.MeshLambertMaterial({color:0x0c3d14}),new THREE.MeshLambertMaterial({color:0x0a2e10}),new THREE.MeshLambertMaterial({color:0x0e4e1a})];
var trees=[];
function mkTree(x,z,s){
  var g=new THREE.Group();g.position.set(x,0,z);
  var th=(1.8+Math.random()*1.0)*s;
  var tr=new THREE.Mesh(new THREE.CylinderGeometry(0.13*s,0.25*s,th,7),tM);tr.position.y=th/2;tr.castShadow=true;g.add(tr);
  for(var i=0;i<3;i++){var ch=(3.8-i*0.5)*s,cr=(1.9-i*0.3)*s;var cn=new THREE.Mesh(new THREE.ConeGeometry(cr,ch,8),pM[i]);cn.position.y=th+i*1.5*s+ch/2-0.4*s;cn.castShadow=true;g.add(cn);}
  g.userData={broken:false,fa:0,fd:new THREE.Vector2(Math.random()-0.5,Math.random()-0.5).normalize(),r:0.45*s};
  scene.add(g);trees.push(g);
}
for(var ti=0;ti<60;ti++){var tx,tz;do{tx=(Math.random()-0.5)*41;tz=(Math.random()-0.5)*41;}while(Math.sqrt(tx*tx+tz*tz)<7);mkTree(tx,tz,0.8+Math.random()*0.6);}

// TRUCK MATERIALS
var bMat=new THREE.MeshPhongMaterial({color:0x1c3d72,shininess:80});
var cMat=new THREE.MeshPhongMaterial({color:0x112244,shininess:60});
var wMat=new THREE.MeshPhongMaterial({color:0x111111,shininess:25});
var rMat=new THREE.MeshPhongMaterial({color:0x888888,shininess:120});
var crMat=new THREE.MeshPhongMaterial({color:0xaaaaaa,shininess:180});
var truck=new THREE.Group();
var wSpin=[],wSteer=[];

(function(){
  function bx(mat,w,h,d,px,py,pz){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(px,py,pz);m.castShadow=true;truck.add(m);}
  bx(new THREE.MeshPhongMaterial({color:0x222222}),2.6,0.4,4.4,0,1.8,0);
  bx(bMat,2.55,0.8,4.2,0,2.12,0);
  var hd=new THREE.Mesh(new THREE.BoxGeometry(2.5,0.5,1.2),bMat);hd.position.set(0,2.38,-1.8);hd.rotation.x=-0.16;hd.castShadow=true;truck.add(hd);
  bx(cMat,2.0,1.0,2.2,0,3.02,0.2);
  var ws=new THREE.Mesh(new THREE.BoxGeometry(1.85,0.55,0.05),new THREE.MeshPhongMaterial({color:0x334466,transparent:true,opacity:0.6}));ws.position.set(0,3.1,-0.84);truck.add(ws);
  bx(crMat,2.65,0.35,0.25,0,1.65,-2.4);
  var hm=new THREE.MeshPhongMaterial({color:0xffffaa,emissive:0xffee66});
  [-0.68,0.68].forEach(function(hx){var h=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.26,0.08),hm);h.position.set(hx,1.86,-2.42);truck.add(h);var pl=new THREE.PointLight(0xffeeaa,1.8,12);pl.position.set(hx,1.82,-3.1);truck.add(pl);});
  var tm=new THREE.MeshPhongMaterial({color:0xff0000,emissive:0xcc0000});
  [-0.68,0.68].forEach(function(tx){var t=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.2,0.07),tm);t.position.set(tx,2.08,2.42);truck.add(t);});
  [-0.65,0.65].forEach(function(ex){var p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.1,8),crMat);p.position.set(ex*1.4,2.85,-0.5);p.rotation.x=-0.18;truck.add(p);});
  bx(crMat,1.7,0.1,0.1,0,3.6,0.2);
  [{x:-1.58,y:1.08,z:1.5,f:true},{x:1.58,y:1.08,z:1.5,f:true},{x:-1.58,y:1.08,z:-1.5,f:false},{x:1.58,y:1.08,z:-1.5,f:false}].forEach(function(w){
    var piv=new THREE.Group();piv.position.set(w.x,w.y,w.z);truck.add(piv);
    var sp=new THREE.Group();piv.add(sp);
    var ti=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,0.68,16),wMat);ti.rotation.z=Math.PI/2;ti.castShadow=true;sp.add(ti);
    var ri=new THREE.Mesh(new THREE.CylinderGeometry(0.54,0.54,0.70,10),rMat);ri.rotation.z=Math.PI/2;sp.add(ri);
    for(var s=0;s<5;s++){var sk=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.72,0.07),new THREE.MeshPhongMaterial({color:0x555555}));sk.rotation.set(0,0,s*Math.PI/5*2);sp.add(sk);}
    var ar=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.12,0.85),new THREE.MeshPhongMaterial({color:0x333333}));ar.position.set(w.x<0?0.35:-0.35,0,0);piv.add(ar);
    wSpin.push(sp);if(w.f)wSteer.push(piv);
  });
}());
scene.add(truck);

// CAR PHYSICS
var cPos=new THREE.Vector3(0,0,0),cAngle=0,cSpeed=0,cSteer=0;
var cHP=100,cScore=0,cKills=0,cDead=false,dFlash=0,dCD=0;
var ACC=12,BRK=18,MXF=15,MXR=6,FRC=0.92,SMX=0.55,SSPD=2.5,WB=3.0;

// INPUT
var keys={};
window.addEventListener('keydown',function(e){keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)!==-1)e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});

// ZOMBIE MODEL
function mkZombie(){
  var g=new THREE.Group();
  var sk=new THREE.MeshLambertMaterial({color:0x4a7a35}),dk=new THREE.MeshLambertMaterial({color:0x2d4a20}),cl=new THREE.MeshLambertMaterial({color:0x3d2810}),ey=new THREE.MeshPhongMaterial({color:0xff0000,emissive:0xdd0000});
  function b(m,w,h,d,px,py,pz){var ms=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);ms.position.set(px,py,pz);ms.castShadow=true;g.add(ms);}
  b(cl,0.21,0.58,0.21,-0.14,0.33,0);b(cl,0.21,0.58,0.21,0.14,0.33,0);
  b(dk,0.19,0.11,0.28,-0.14,0.05,0.03);b(dk,0.19,0.11,0.28,0.14,0.05,0.03);
  b(cl,0.50,0.65,0.28,0,1.0,0);b(sk,0.34,0.34,0.34,0,1.64,0);
  b(ey,0.07,0.06,0.04,-0.09,1.69,0.17);b(ey,0.07,0.06,0.04,0.09,1.69,0.17);
  b(new THREE.MeshLambertMaterial({color:0x1a0000}),0.16,0.06,0.04,0,1.56,0.17);
  var aL=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.50,0.19),sk);aL.position.set(-0.37,1.05,-0.05);aL.rotation.set(-0.3,0,0.45);g.add(aL);
  var aR=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.50,0.19),sk);aR.position.set(0.37,1.05,-0.05);aR.rotation.set(-0.3,0,-0.45);g.add(aR);
  g.userData.wp=Math.random()*6.28;return g;
}

// ROBOT MODEL
function mkRobot(){
  var g=new THREE.Group();
  var mt=new THREE.MeshPhongMaterial({color:0x6a6a82,shininess:110}),dk=new THREE.MeshPhongMaterial({color:0x383848,shininess:70}),ey=new THREE.MeshPhongMaterial({color:0xff2200,emissive:0xff1100}),gl=new THREE.MeshPhongMaterial({color:0x66aaff,emissive:0x1133aa});
  function b(m,w,h,d,px,py,pz){var ms=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);ms.position.set(px,py,pz);ms.castShadow=true;g.add(ms);}
  b(mt,0.21,0.36,0.21,-0.17,0.54,0);b(dk,0.19,0.32,0.19,-0.17,0.19,0);b(mt,0.24,0.12,0.32,-0.17,0.04,0.05);
  b(mt,0.21,0.36,0.21,0.17,0.54,0);b(dk,0.19,0.32,0.19,0.17,0.19,0);b(mt,0.24,0.12,0.32,0.17,0.04,0.05);
  b(dk,0.50,0.20,0.28,0,0.76,0);b(mt,0.58,0.68,0.34,0,1.18,0);b(gl,0.32,0.09,0.04,0,1.25,0.18);
  b(mt,0.20,0.20,0.40,-0.42,1.40,0);b(mt,0.20,0.20,0.40,0.42,1.40,0);
  b(mt,0.18,0.40,0.18,-0.44,1.04,0);b(dk,0.16,0.34,0.16,-0.44,0.73,0);b(mt,0.22,0.22,0.22,-0.44,0.52,0);
  b(mt,0.18,0.40,0.18,0.44,1.04,0);b(dk,0.16,0.34,0.16,0.44,0.73,0);b(mt,0.22,0.22,0.22,0.44,0.52,0);
  var nk=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,0.18,8),dk);nk.position.y=1.60;g.add(nk);
  b(mt,0.46,0.40,0.40,0,1.88,0);b(ey,0.09,0.06,0.05,-0.10,1.91,0.21);b(ey,0.09,0.06,0.05,0.10,1.91,0.21);
  var an=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.28,6),dk);an.position.set(0.13,2.24,0);g.add(an);
  g.userData.wp=Math.random()*6.28;return g;
}

// ENEMIES
var enemies=[],spTimer=0;
function spawnEnemy(type){
  var x,z;do{x=(Math.random()-0.5)*40;z=(Math.random()-0.5)*40;}while(Math.sqrt((x-cPos.x)*(x-cPos.x)+(z-cPos.z)*(z-cPos.z))<8);
  var m=type==='zombie'?mkZombie():mkRobot();m.position.set(x,0,z);scene.add(m);
  enemies.push({mesh:m,type:type,hp:type==='zombie'?30:55,alive:true,dying:false,dt:0,at:0,spd:type==='zombie'?1.6+Math.random()*0.8:2.0+Math.random()*0.9});
}
for(var i=0;i<10;i++) spawnEnemy(i%2===0?'zombie':'robot');

// PARTICLES
var parts=[];
function boom(pos,col,n){
  for(var i=0;i<n;i++){
    var pm=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.12),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1}));
    pm.position.set(pos.x,pos.y+1,pos.z);
    var pv=new THREE.Vector3((Math.random()-0.5)*5,Math.random()*4+1,(Math.random()-0.5)*5);
    scene.add(pm);parts.push({m:pm,v:pv,l:1.0});
  }
}

// KILL ENEMY
function killEnemy(e){
  if(!e.alive)return;
  e.alive=false;e.dying=true;e.dt=0;
  boom(e.mesh.position,e.type==='zombie'?0x8B0000:0xaaaaaa,e.type==='zombie'?10:12);
  cScore+=e.type==='zombie'?100:150;cKills++;updateHUD();
}

// HUD
var hpBar=document.getElementById('hp-bar'),hpTxt=document.getElementById('hp-txt');
var scTxt=document.getElementById('sc-txt'),klTxt=document.getElementById('kl-txt'),enTxt=document.getElementById('en-txt');
var over=document.getElementById('over');
function updateHUD(){
  var p=Math.max(0,cHP);hpBar.style.width=p+'%';
  hpBar.style.background=p>60?'linear-gradient(90deg,#4caf50,#8bc34a)':p>30?'linear-gradient(90deg,#ff9800,#ffc107)':'linear-gradient(90deg,#e63946,#ff5252)';
  hpTxt.textContent=Math.max(0,Math.ceil(cHP))+' / 100';
  scTxt.textContent='\u2605 \u041e\u0447\u043a\u0438: '+cScore;
  klTxt.textContent='\u0423\u0431\u0438\u0442\u043e: '+cKills;
  var a=0;for(var i=0;i<enemies.length;i++)if(enemies[i].alive)a++;
  enTxt.textContent='\u0412\u0440\u0430\u0433\u0438: '+a;
}
function showOver(){
  document.getElementById('res').textContent='\u041e\u0447\u043a\u0438: '+cScore+'   |   \u0423\u0431\u0438\u0442\u043e: '+cKills;
  over.style.display='flex';
}

// MAIN LOOP
var camTgt=new THREE.Vector3(),clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  if(cDead){renderer.render(scene,cam);return;}

  var gas=keys.KeyW||keys.ArrowUp,rev=keys.KeyS||keys.ArrowDown;
  var goL=keys.KeyA||keys.ArrowLeft,goR=keys.KeyD||keys.ArrowRight,eb=keys.Space;
  cSteer+=(( goL?SMX:goR?-SMX:0)-cSteer)*SSPD*dt;
  if(gas)cSpeed=Math.min(cSpeed+ACC*dt,MXF);
  else if(rev){if(cSpeed>0.2)cSpeed-=BRK*dt;else cSpeed=Math.max(cSpeed-ACC*0.5*dt,-MXR);}
  else if(eb)cSpeed*=Math.pow(0.3,dt*6);
  else{cSpeed*=Math.pow(FRC,dt*60);if(Math.abs(cSpeed)<0.03)cSpeed=0;}
  if(Math.abs(cSpeed)>0.05)cAngle+=(cSpeed/WB)*Math.sin(cSteer)*2.3*dt;
  cPos.x+=Math.sin(cAngle)*cSpeed*dt;cPos.z+=Math.cos(cAngle)*cSpeed*dt;
  var B=HALF-1.5;
  if(cPos.x<-B){cPos.x=-B;cSpeed*=-0.3;}if(cPos.x>B){cPos.x=B;cSpeed*=-0.3;}
  if(cPos.z<-B){cPos.z=-B;cSpeed*=-0.3;}if(cPos.z>B){cPos.z=B;cSpeed*=-0.3;}
  truck.position.set(cPos.x,0,cPos.z);truck.rotation.y=cAngle;
  var ws=cSpeed*dt*1.1;
  for(var i=0;i<wSpin.length;i++)wSpin[i].rotation.y+=ws;
  for(var i=0;i<wSteer.length;i++)wSteer[i].rotation.y=cSteer*0.65;

  // Trees
  for(var i=0;i<trees.length;i++){
    var t=trees[i];
    if(t.userData.broken){if(t.userData.fa<Math.PI/2){t.userData.fa+=dt*2.0;var fa=Math.min(t.userData.fa,Math.PI/2);var fd=t.userData.fd;t.rotation.x=fd.y*fa;t.rotation.z=-fd.x*fa;}continue;}
    var dx=t.position.x-cPos.x,dz=t.position.z-cPos.z,d2=dx*dx+dz*dz,R=t.userData.r+1.4;
    if(d2<R*R){t.userData.broken=true;var m=Math.sqrt(d2)||1;t.userData.fd.set(dx/m,dz/m);cSpeed*=0.5;boom(t.position,0x3a1e0a,5);}
  }

  // Enemies
  spTimer+=dt;var alive=0;
  for(var i=0;i<enemies.length;i++)if(enemies[i].alive)alive++;
  if(spTimer>4.5&&alive<20){spTimer=0;spawnEnemy(Math.random()<0.5?'zombie':'robot');if(alive<10)spawnEnemy(Math.random()<0.5?'zombie':'robot');}
  dCD=Math.max(0,dCD-dt);
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive){if(e.dying){e.dt+=dt;e.mesh.position.y-=dt*1.0;e.mesh.rotation.z+=dt*2.5;if(e.dt>1.5){scene.remove(e.mesh);e.dying=false;}}continue;}
    var dx=cPos.x-e.mesh.position.x,dz=cPos.z-e.mesh.position.z,dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>0.3){e.mesh.position.x+=(dx/dist)*e.spd*dt;e.mesh.position.z+=(dz/dist)*e.spd*dt;e.mesh.rotation.y=Math.atan2(dx,dz);}
    e.mesh.userData.wp+=dt*e.spd*3.5;e.mesh.position.y=Math.abs(Math.sin(e.mesh.userData.wp))*0.08;e.mesh.rotation.x=0.1;
    if(dist<2.1){e.at+=dt;if(e.at>=1.0&&dCD<=0){cHP-=5;e.at=0;dCD=0.25;dFlash=0.2;updateHUD();if(cHP<=0){cDead=true;showOver();return;}}}else{e.at=0;}
    if(dist<2.3&&Math.abs(cSpeed)>3.0){e.hp-=Math.abs(cSpeed)*3.5*dt;if(e.hp<=0)killEnemy(e);}
  }
  dFlash=Math.max(0,dFlash-dt);bMat.color.setHex(dFlash>0?0xff2200:0x1c3d72);

  // Particles
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.v.y-=9.8*dt;p.m.position.x+=p.v.x*dt;p.m.position.y+=p.v.y*dt;p.m.position.z+=p.v.z*dt;p.l-=dt;p.m.material.opacity=Math.max(0,p.l);if(p.l<=0){scene.remove(p.m);parts.splice(i,1);}}

  // Camera
  var cx=cPos.x-Math.sin(cAngle)*13,cz=cPos.z-Math.cos(cAngle)*13;
  cam.position.x+=(cx-cam.position.x)*6*dt;cam.position.z+=(cz-cam.position.z)*6*dt;cam.position.y+=(8.5-cam.position.y)*5*dt;
  camTgt.set(cPos.x,1.5,cPos.z);cam.lookAt(camTgt);
  updateHUD();renderer.render(scene,cam);
}
updateHUD();animate();
</script>
